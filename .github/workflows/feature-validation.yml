name: Feature branch validation

on:
  push:
    branches:
      - feature/usb-disk-encryption
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: PHP syntax checks
        run: |
          find app -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run read-only regression tests
        run: |
          set -eu
          for test in app/development/tests/*_test.php; do
            echo "Running $test"
            php "$test"
          done

  root-authorization-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Run isolated root-only registry and discovery tests
        run: |
          set -eu
          for test in \
            app/development/tests/registered_operation_inspection_test.php \\
            app/development/tests/authorized_operation_inspection_test.php \\
            app/development/tests/authorized_operation_discovery_failure_test.php; do
            echo "Running as root: $test"
            sudo php "$test"
          done

  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only DOM implementation
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Test incremental inventory updates
        run: node app/development/tests/inventory_browser_test.cjs
